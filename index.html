
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manshi Birthday Surprise</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: #ffe6f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  #page1, #page2 {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 1s ease;
  }
  #page2 {opacity: 0; pointer-events: none;}
  .hidden {opacity: 0; pointer-events: none;}
  
  /* Speaker */
  #speaker {
    width: 100px;
    cursor: pointer;
    transition: transform 0.3s;
  }
  #speaker:hover {
    transform: scale(1.1);
  }

  /* Candle */
  #candle {
    width: 50px;
    margin-top: 20px;
  }
  .blow {
    animation: blow 1s forwards;
  }
  @keyframes blow {
    0% {opacity:1; transform: translateY(0);}
    100% {opacity:0; transform: translateY(-30px);}
  }

  /* Birthday message */
  #wish {
    font-size: 2em;
    color: #ff0066;
    text-align: center;
    opacity: 0;
    animation: fadeIn 2s forwards;
  }
  @keyframes fadeIn {
    to {opacity:1;}
  }

  /* Cake */
  #cake {
    width: 150px;
    margin-top: 20px;
    position: relative;
  }
  .slice {
    width: 0;
    height: 0;
    border-left: 75px solid transparent;
    border-right: 75px solid transparent;
    border-bottom: 100px solid #ff6699;
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: bottom center;
    transition: transform 1s;
  }
  .cut {transform: rotate(20deg);}
</style>
</head>
<body>

<!-- Page 1: Speaker and Candle -->
