<!DOCTYPE html>
<html>
  <head>
    <title>Memorial Virtual Prototipo</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene renderer="antialias: true; colorManagement: true;" vr-mode-ui="enabled: false">
      
      <a-assets>
        <img id="foto-difunto" src="https://cdn.glitch.global/b3f94300-4803-45d9-b17d-173381b41608/placeholder-portrait.jpg?v=1677689000000">
        <img id="cielo-atardecer" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg">
      </a-assets>

      <a-sky src="#cielo-atardecer" rotation="0 -90 0"></a-sky>

      <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane>
      
      <a-box position="0 0.5 -3" rotation="0 0 0" color="#4CC3D9" depth="0.5" height="1" width="1"></a-box>
      
      <a-image src="#foto-difunto" position="0 1.6 -3" width="1.5" height="2"></a-image>

      <a-text value="En Memoria de Juan Perez\n1940 - 2023\nAmado padre y abuelo." 
              position="0 2.8 -3" align="center" color="#FFFFFF" width="4"></a-text>

      <a-entity position="0 1.6 0">
        <a-camera look-controls="enabled: true" wasd-controls="enabled: false"></a-camera>
      </a-entity>
      
    </a-scene>
  </body>
</html>
