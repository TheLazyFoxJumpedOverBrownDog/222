<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Çift Sohbet</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    #chat { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    #message { width: 80%; }
    #send { width: 15%; }
  </style>
</head>
<body>
  <h1>Çift Sohbet</h1>
  <div id="chat"></div>
  <input type="text" id="message" placeholder="Mesaj yaz..." />
  <button id="send">Gönder</button>

  <script>
    const chat = document.getElementById('chat');
    const messageInput = document.getElementById('message');
    const sendButton = document.getElementById('send');

    // Glitch'te çalışan bir sunucu için (örneğin, Glitch'in kendi WebSocket'ı)
    // Glitch'te doğrudan WebSocket kullanamayız, ama basit bir alternatif kullanacağız
    // Glitch'te sadece HTTP kullanılır, bu yüzden basit bir yöntemle yapalım

    // Basit bir yöntem: Her 2 saniyede bir sayfayı yenile ve mesajları oku
    const messages = [];
    let lastMessageId = 0;

    function fetchMessages() {
      fetch('/messages')
        .then(res => res.json())
        .then(data => {
          data.messages.forEach(msg => {
            if (msg.id > lastMessageId) {
              lastMessageId = msg.id;
              chat.innerHTML += `<p>${msg.text}</p>`;
            }
          });
        });
    }

    // Mesaj gönder
    sendButton.addEventListener('click', () => {
      const message = messageInput.value.trim();
      if (message !== '') {
        fetch('/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: message })
        });
        messageInput.value = '';
      }
    });

    // Sayfa yüklendiğinde mesajları çek
    setInterval(fetchMessages, 2000);
  </script>
</body>
</html>
