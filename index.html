<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="gamefacts.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameFacts</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">

<body>
    <header>
        <img src="gamefacts.jpg" alt="GameFacts" width="400" height="200"><div class="logo"></div>
        <nav>
            <a href="index.html"><button class="nav-btn active" id="homeBtn">Home</button></a>
            <a href="gallery.html"><button class="nav-btn" id="contentBtn">Gallery</button></a>
            <a href="https://www.nintendo.com/au/about/"><button class="nav-btn" id="contentBtn">About</button></a>
            
        </nav>
    </header>

    <div id="mainContent">
    <section class="slider">
        <br>
        <br>
        <br>
        <br>
        <br>
        <h1>LATEST Updates</h1>
        <button class="arrow left" id="prevBtn">❮</button>
        <div class="slides-wrapper">
            <div class="slides" id="slides">
                <img src="zelda2.png" alt="Hyrule Warriors">
                <img src="dk1.jpg" alt="Donkey Kong">
                <img src="sonic2.jpg" alt="Sonic Racing">
                <img src="cloud1.jpg" alt="Final Fantasy">
                </div>
            </div>
            <button class="arrow right" id="nextBtn">❯</button>
        </section>
    </div>

    <section class="discover">
        <br>
        <br>
        <br>
        <br>
        <br>
        <br>
        <h2>Discover</h2>
        <div class="discover-grid">
            <div class="card">
                <a href="https://www.nintendo.com/au/games/nintendo-switch/the-legend-of-zelda-tears-of-the-kingdom/"><img src="zelda1.jpg" alt="Game 1"></a>
                <p>Explore the latest Zelda adventures.</p>
            </div>
        <div class="card">
            <a href="https://www.nintendo.com/au/games/nintendo-switch/super-mario-galaxy-plus-super-mario-galaxy-2/"><img src="mario1.png" alt="Game 2"></a>
            <p>Blast into Mario's space adventures.</p>
            </div>
        <div class="card">
            <a href="https://www.nintendo.com/au/games/nintendo-switch/sonic-frontiers/"><img src="sonic1.webp" alt="Game 3"></a>
            <p>Speed through Sonic's new challenges.</p>
            </div>
        </div>
    </section>


    <footer>
        <p>Copyright ©2025 | Made by Abbas Monshizada</p>
        <div class="footer-links">
            <a href="https://www.nintendo.com/au/about/" id="aboutLink">About</a> |
            <a href="https://www.nintendo.com/au/support/" id="supportLink">Support</a> |
            <a href="https://www.nintendo.com/au/support/contact-us/" id="contactLink">Contact</a>
        </div>
        <div class="social-icons">
            <a href="https://www.facebook.com/NintendoAmerica/"><i class="bx bxl-facebook-square"></i></a>
            <a href="https://www.instagram.com/nintendoamerica/?hl=en"><i class="bx bxl-instagram-alt"></i></a>
            <a href="https://x.com/NintendoAmerica?ref_src=twsrc%5Egoogle%7Ctwcamp%5Eserp%7Ctwgr%5Eauthor"><i class="bx bxl-twitter"></i></a>
