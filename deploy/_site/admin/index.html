<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,.08);
            width: 320px;
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        #msg {
            margin-top: 12px;
            color: #c00;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Admin Login</h1>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3pt3fBLum7MqDgxigLijqgpVQvGIFxy4",
  authDomain: "game-site-84791.firebaseapp.com",
  projectId: "game-site-84791",
  storageBucket: "game-site-84791.firebasestorage.app",
  messagingSenderId: "512529430981",
  appId: "1:512529430981:web:a09e38bb2909382b81b3ac",
  measurementId: "G-G9NL3VBJQP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "/admin/panel.html";
    } catch (err) {
        msg.textContent = "Invalid email or password.";
    }
};
</script>

</body>
</html>
